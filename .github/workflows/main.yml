name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional stable signing. Without these repository secrets the build falls back to the
      # (ephemeral) debug keystore, which changes on every run and forces an uninstall to update.
      # Required secrets for a proper release build:
      #   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      - name: Decode release keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release keystore secret found."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No RELEASE_KEYSTORE_BASE64 secret - building a debug-signed APK."
          fi

      - name: Build APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o "*.zip"
          fi
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"

          # Surface the real compiler/test errors as GitHub annotations: the job log is not always
          # reachable from tooling, annotations are.
          report_failure() {
            local logfile="$1"
            local label="$2"
            echo "::error::$label failed - see the annotated lines below"
            grep -aE '^e: |error:|FAILED|Execution failed|Caused by:|> Task .* FAILED|tests completed' "$logfile" \
              | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 25 "$logfile" | while IFS= read -r line; do echo "::error::$line"; done
          }

          if [ -d app/src/test ]; then
            echo "Running JVM unit tests"
            if ! gradle testDebugUnitTest --no-daemon --stacktrace > unit-tests.log 2>&1; then
              report_failure unit-tests.log "Unit tests"
              exit 1
            fi
            tail -n 5 unit-tests.log
          fi

          if [ -n "$RELEASE_KEYSTORE_FILE" ] && [ -n "$RELEASE_STORE_PASSWORD" ] \
             && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Building signed release APK (stable signature)"
            TASK=assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            echo "Building debug APK"
            TASK=assembleDebug
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if ! gradle "$TASK" --no-daemon --stacktrace > build.log 2>&1; then
            report_failure build.log "Gradle $TASK"
            exit 1
          fi
          tail -n 5 build.log

          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apk_out/EarbudAmbientCopilot.apk"
          ls -l "$GITHUB_WORKSPACE/apk_out/EarbudAmbientCopilot.apk"

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Earbud-Ambient-Copilot-APK
          path: apk_out/EarbudAmbientCopilot.apk
