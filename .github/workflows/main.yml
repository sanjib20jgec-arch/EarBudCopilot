name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o "*.zip"
          fi
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk_out/EarbudAmbientCopilot.apk"

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Earbud-Ambient-Copilot-APK
          path: apk_out/EarbudAmbientCopilot.apk
